<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="/src/assets/favicon/likelion.ico"
      type="image/x-icon"
    />
    <link rel="icon" href="/src/assets/favicon/likelion.svg" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"

    <link rel="stylesheet" href="/src/ui/components/input/input.css" />

  <body>
    <div class="components-container">
      <h1>입력 서식 컴포넌트</h1>
      <form action="/" method="post">

          <!-- 입력 서식 컴포넌트 (input) : 레이블 유형 -->
          <div class="input show-label">
            <label class="input__label" for="input-1">레이블</label>
            <input
              class="input__input"
              type="email"
              name="input-1"
              id="input-1"
              required
              placeholder="플레이스 홀더 텍스트"
              aria-errormessage="error-message-1"
            />
            <p
              class="input__error-message"
              id="error-message-1"
              aria-live="polite"
            >
              <span>에러 메시지를 입력해 주세요.</span>
            </p>
          </div>
          <div class="input show-label">
