<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="/src/assets/favicon/likelion.ico"
      type="image/x-icon"
    />
    <link rel="icon" href="/src/assets/favicon/likelion.svg" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="/src/css/styles/19-animation.css" />
    <script type="module" src="/src/css/js/19-animation.js"></script>
    <title>CSS 애니메이션</title>
  </head>
  <body>
    <h1>CSS애니메이션</h1>
    <div class="container">
      <div class="case case-01">
        <strong>Fade 애니메이션</strong>
        <div class="controls">
          <button type="button" class="reset-animation button">초기화</button>
          <button type="button" class="toggle-animation">재생</button>
        </div>
        <div class="target-animation">Fade 애니메이션</div>
      </div>
      <div class="case case-02">
        <strong>Shrink 애니메이션</strong>
        <div class="controls">
          <button type="button" class="reset-animation button">초기화</button>
          <button type="button" class="toggle-animation">재생</button>
        </div>
        <div class="target-animation">Shrink 애니메이션</div>
      </div>
      <div class="case case-03">
        <strong>Bounce 애니메이션</strong>
        <div class="controls">
          <button type="button" class="reset-animation">초기화</button>
          <button type="button" class="toggle-animation">재생</button>
        </div>
        <div class="target-animation">Bounce 애니메이션</div>
      </div>
      <div class="case case-04">
        <strong>Shake 애니메이션</strong>
        <div class="controls">
          <button type="button" class="reset-animation">초기화</button>
          <button type="button" class="toggle-animation">재생</button>
        </div>
        <div class="target-animation">Shake 애니메이션</div>
      </div>
      <div class="case case-05">
        <strong>Spin 애니메이션</strong>
        <div class="controls">
          <button type="button" class="reset-animation">초기화</button>
          <button type="button" class="toggle-animation">재생</button>
        </div>
        <div class="target-animation">Spin 애니메이션</div>
      </div>
      <div class="case case-06">
        <strong>Pulse Ainimation</strong>
        <div class="controls">
          <button type="button" class="reset-animation">초기화</button>
          <button type="button" class="toggle-animation">재생</button>
        </div>
        <div class="target-animation">Pulse Ainimation</div>
      </div>
      <div class="case case-07">
        <strong>flip 애니메이션</strong>
        <div class="controls">
          <button type="button" class="reset-animation">초기화</button>
          <button type="button" class="toggle-animation">재생</button>
        </div>
        <div class="target-animation">flip 애니메이션</div>
      </div>
      <div class="case case-08">
        <strong>Wobble 애니메이션</strong>
        <div class="controls">
          <button type="button" class="reset-animation">초기화</button>
          <button type="button" class="toggle-animation">재생</button>
        </div>
        <div class="target-animation">Wobble 애니메이션</div>
      </div>
      <div class="case case-09">
        <strong>Glow 애니메이션</strong>
        <div class="controls">
          <button type="button" class="reset-animation">초기화</button>
          <button type="button" class="toggle-animation">재생</button>
        </div>
        <div class="target-animation">Glow 애니메이션</div>
      </div>
      <div class="case case-10">
        <strong>Neon Border 애니메이션</strong>
        <div class="controls">
          <button type="button" class="reset-animation">초기화</button>
          <button type="button" class="toggle-animation">재생</button>
        </div>
        <div class="target-animation">Neon Border 애니메이션</div>
      </div>
    </div>
  </body>
</html>
